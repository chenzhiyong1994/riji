<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>日跻 · 80 个动作动画</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#253d34;background:#edf1ec;font:15px/1.6 "Microsoft YaHei",system-ui,sans-serif}main{max-width:1360px;margin:auto;padding:32px 28px 64px}header{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:22px}h1{font-size:32px;line-height:1.3;font-weight:600;margin:8px 0}h2{font-size:18px;line-height:1.45;margin:0}.eyebrow{letter-spacing:.15em;font-size:12px;color:#60766a}p{margin:0}.muted{color:#60766a}button,input,select{font:inherit;color:inherit}button,select,input{border:1px solid #c3d1c5;border-radius:12px;background:#fff;padding:10px 14px}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #27876c;outline-offset:3px}.filters{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px;position:sticky;top:0;padding:12px 0;background:#edf1ec;z-index:2}.filters input{flex:1;min-width:180px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.card{background:white;border:1px solid #d4dfd5;border-radius:16px;overflow:hidden}.label{padding:16px 18px;min-height:90px}.tag{font-size:12px;color:#6a8073}.stage{aspect-ratio:6/7;background:#dce1dd;display:flex;align-items:center;justify-content:center;overflow:hidden}.stage img{width:100%;height:100%;object-fit:contain}.actions{display:flex;align-items:center;gap:16px;justify-content:space-between;padding:14px 18px}.actions a{font-size:13px;color:#367654}.playing{border-color:#27876c;box-shadow:0 0 0 2px #27876c}.empty{color:#6a8073}.note{border-top:1px solid #c3d1c5;margin-top:28px;padding-top:20px;color:#60766a;font-size:13px}.count{margin-bottom:16px;color:#60766a}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){main{padding:22px 14px 40px}header{align-items:start;flex-direction:column}h1{font-size:26px}.grid{grid-template-columns:1fr}.filters{gap:8px}.filters input{width:100%;flex-basis:100%}.label{min-height:76px}.stage{max-height:580px}}

.actions{flex-wrap:wrap}.asset-links{display:flex;gap:12px;flex-wrap:wrap}h1 span{display:inline-block}.header-actions{display:flex;gap:10px;flex-wrap:wrap}.review-toolbar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:10px;color:#60766a}.review-toolbar select{margin-left:8px}.review-fields{padding:0 18px 18px;display:grid;gap:12px}.review-fields label{display:grid;gap:6px;color:#60766a;font-size:13px}.review-fields select,.review-fields textarea{width:100%;min-width:0;font:inherit;color:#253d34;border:1px solid #c3d1c5;border-radius:10px;padding:8px 10px;background:#fff}.review-fields textarea{resize:vertical;min-height:68px}.storage-message{color:#92451a;margin:0 0 14px}.storage-message:empty{display:none}
</style>
<main>
<header><div><p class="eyebrow">日跻 / MOTION LIBRARY</p><h1><span>80 个动作</span> · <span>待检查动画库</span></h1><p class="muted">逐项播放，记录需要修复或删除的动作。这批候选动画已接入 APP。</p></div><div class="header-actions"><button id="pause-all">暂停播放</button><button id="export-review">导出检查清单</button></div></header>
<div class="filters"><input id="search" type="search" placeholder="搜索动作名称" aria-label="搜索动作"><select id="category" aria-label="训练分类"><option value="全部">全部分类</option></select><select id="status" aria-label="制作状态"><option value="all">全部动作</option><option value="encoded">已有动图</option><option value="pending">待完成</option></select></div>
<div class="review-toolbar"><label>检查结果 <select id="review-filter"><option value="all">全部结果</option><option value="pending">待检查</option><option value="keep">保留</option><option value="repair">需修复</option><option value="remove">删除</option></select></label><span id="review-count" aria-live="polite"></span></div>
<p class="count" id="count" aria-live="polite"></p><p id="storage-message" class="storage-message" role="status"></p><section class="grid" id="grid" aria-label="动作动画"></section>
<footer class="note"><p>768 × 896 · 72 帧 · 3 秒循环。一次播放一个动作；暂停时显示封面，可打开“关键姿势”查看静态位置。红色明暗提示动作阶段，肌群边界为美术示意。</p><p>人体基础资产：MakeHuman CC0；动画、器械、分区和渲染由本项目制作。技术检查通过不代表动作姿势合格，仍需检查关节朝向、握持与器械位置。标记仅记录检查意见，不会直接删除文件或改变 APP。</p><p>检查结果保存在当前浏览器；可导出 JSON 清单，保留动作编号、文件版本与备注。</p></footer>
</main>
<script src="gallery-data.js"></script>
<script src="preview.js"></script>
</html>
